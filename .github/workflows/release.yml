name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  EXPECTED_RELEASE_ARTIFACTS: 5

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          # aarch64-linux: install.sh maps arm64/aarch64 to this target, so it
          # must exist in the release — previously the one-liner installer
          # 404'd on Raspberry Pi / Graviton / ARM WSL (review §4.2). GitHub's
          # arm64 runner builds it natively — no cross toolchain needed.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --features tree-sitter-all

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../context-builder-${{ matrix.target }}.tar.gz context-builder
          cd ../../..

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/context-builder.exe" -DestinationPath "context-builder-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: context-builder-${{ matrix.target }}
          path: context-builder-${{ matrix.target }}.${{ matrix.archive }}

  validate:
    name: Validate Release Artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Validate archives and generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z)
          if [[ "${#archives[@]}" -ne "$EXPECTED_RELEASE_ARTIFACTS" ]]; then
            echo "Expected $EXPECTED_RELEASE_ARTIFACTS release archives, found ${#archives[@]}" >&2
            exit 1
          fi

          : > SHA256SUMS
          for archive in "${archives[@]}"; do
            case "$archive" in
              *.tar.gz)
                [[ "$(tar -tzf "$archive")" == 'context-builder' ]]
                ;;
              *.zip)
                [[ "$(unzip -Z1 "$archive")" == 'context-builder.exe' ]]
                ;;
            esac

            checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$checksum" "$(basename "$archive")" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: SHA256SUMS

  release:
    name: Create Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/context-builder-*/*
            artifacts/release-checksums/SHA256SUMS
